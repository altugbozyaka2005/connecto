# coturn: TURN relay for Connecto video calls.
# The shared secret is passed on the command line from /docker/connecto/.env (TURN_SECRET).

listening-port=3478
# Public IP for callers; 127.0.0.1 for Traefik forwarding "turns:" traffic.
listening-ip=31.97.183.135
listening-ip=127.0.0.1
# Relay only on the public IP (not Docker's internal 172.x bridges).
relay-ip=31.97.183.135
realm=connecto.clientchase.com

# Time-limited credentials minted by the Connecto server (see turn.js).
use-auth-secret
fingerprint

# TLS for "turns:" is terminated by Traefik on 443 and forwarded here as plain TCP
# (no certificate here, so coturn opens no TLS/DTLS listeners of its own).
no-tls

# Relay ports (must also be open in ufw).
min-port=49160
max-port=49999

# Never relay into private networks (Docker, n8n's internal port, cloud metadata).
# Our own public IP stays allowed: when both callers need TURN, their relays talk to each other.
# TCP relaying is off (browsers only use UDP relays), so the relay can't reach SSH or other TCP
# services on this host.
no-tcp-relay
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits: allocations per user and in total, bandwidth per session (bytes/sec, ~4 Mbit).
user-quota=10
total-quota=1000
max-bps=500000

stale-nonce=600
no-software-attribute
log-file=stdout
simple-log
